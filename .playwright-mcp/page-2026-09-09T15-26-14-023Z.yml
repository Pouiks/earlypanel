      - generic [ref=f1e40]:
        - paragraph [ref=f1e41]: C'est la première question que posent les équipes qui préparent un test utilisateur, et c'est celle à laquelle on répond le plus mal, parce qu'on y répond avec un chiffre. Le bon nombre de testeurs dépend de ce que vous voulez apprendre. Une fois la question posée correctement, le chiffre vient tout seul.
        - heading "Trois types de questions, trois tailles de panel" [level=2] [ref=f1e42]
        - paragraph [ref=f1e43]:
          - generic [ref=f1e44]:
            - img "Schéma temporaire" [ref=f1e45]
            - generic [ref=f1e46]: Légende de test sous l'image
        - 'heading "« Où est-ce que ça coince ? » : un test qualitatif" [level=3] [ref=f1e47]'
        - paragraph [ref=f1e48]: "Vous cherchez à découvrir les frictions d'un parcours : les endroits où les gens hésitent, se trompent, abandonnent ou comprennent autre chose que ce que vous vouliez dire. C'est le cas le plus fréquent, et c'est celui où l'on a besoin de moins de monde qu'on ne le croit."
        - paragraph [ref=f1e49]: "La règle des « cinq utilisateurs », popularisée par le Nielsen Norman Group, repose sur une observation simple : les premiers participants révèlent la majorité des problèmes, et chaque participant supplémentaire en découvre de moins en moins de nouveaux. Cinq personnes suffisent pour trouver les problèmes les plus fréquents d'un parcours donné, pour un public homogène."
        - paragraph [ref=f1e50]:
          - text: Dans la pratique d'un test à distance, nous recommandons plutôt
          - strong [ref=f1e51]: huit à douze participants
          - text: ", pour trois raisons :"
        - list [ref=f1e52]:
          - listitem [ref=f1e53]:
            - strong [ref=f1e54]: À distance, il y a de la perte.
            - text: Sans animateur, une réponse sur dix est inutilisable, trop courte ou hors sujet. Il faut de la marge pour que le panel final reste solide.
          - listitem [ref=f1e55]:
            - strong [ref=f1e56]: Votre cible n'est presque jamais homogène.
            - text: Si votre produit s'adresse à des gérants de TPE et à des freelances, à des gens à l'aise avec le numérique et à d'autres qui ne le sont pas, chaque sous-groupe doit compter au moins trois ou quatre personnes pour qu'un problème observé ne soit pas un cas isolé.
          - listitem [ref=f1e57]:
            - strong [ref=f1e58]: Un chiffre par scénario devient lisible.
            - text: « 9 sur 12 ont envoyé le devis » se comprend immédiatement. « 3 sur 4 » laisse un doute.
        - paragraph [ref=f1e59]: "Au-delà de quinze, le rendement chute : vous relisez deux fois plus de réponses pour apprendre à peine plus. Si vous avez le budget pour trente testeurs, faites plutôt deux tests de douze à un mois d'intervalle, avant et après vos correctifs."
        - 'heading "« Quelle version est la meilleure ? » : une comparaison" [level=3] [ref=f1e60]'
        - paragraph [ref=f1e61]:
          - text: Vous hésitez entre deux parcours, deux formulations, deux structures de page. Ici, chaque participant ne voit qu'une version, ou voit les deux dans un ordre alterné. Il faut donc au minimum
          - strong [ref=f1e62]: doubler le panel
          - text: ", soit une vingtaine de participants pour une comparaison à deux branches, et davantage si les différences attendues sont subtiles."
        - paragraph [ref=f1e63]: "Avant de lancer ce type de test, posez-vous une question honnête : la différence entre les deux versions est-elle assez grande pour qu'un test qualitatif la détecte ? Si vous comparez deux nuances d'un même bouton, la réponse est non, et un test A/B en production sur du trafic réel fera mieux, moins cher."
        - 'heading "« Quel pourcentage de nos utilisateurs réussit ? » : une mesure" [level=3] [ref=f1e64]'
        - paragraph [ref=f1e65]: "Vous voulez un chiffre fiable, avec une marge d'erreur, pour le présenter à un comité ou le suivre dans le temps. C'est de la mesure quantitative, et ses règles sont celles des statistiques : à trente participants, une proportion observée reste entourée d'une marge d'erreur de l'ordre de quinze points. Pour descendre sous cinq points, il faut plusieurs centaines de réponses."
        - paragraph [ref=f1e66]:
          - text: Un test utilisateur à distance, avec recrutement à la main et relecture humaine, n'est pas l'outil adapté pour ça. Les analytics de votre produit le sont. Le test utilisateur vous dit
          - strong [ref=f1e67]: pourquoi
          - text: le chiffre est ce qu'il est ; les analytics vous disent
          - strong [ref=f1e68]: combien
          - text: .
        - heading "Les questions à se poser avant de fixer le chiffre" [level=2] [ref=f1e69]
        - list [ref=f1e70]:
          - listitem [ref=f1e71]:
            - strong [ref=f1e72]: Combien de segments distincts dans ma cible ?
            - text: Comptez trois à quatre personnes par segment que vous voulez vraiment observer.
          - listitem [ref=f1e73]:
            - strong [ref=f1e74]: Combien de scénarios ?
            - text: Au-delà de quatre ou cinq scénarios, la fatigue dégrade les réponses de fin de test. Mieux vaut deux vagues plus courtes qu'une longue.
          - listitem [ref=f1e75]:
            - strong [ref=f1e76]: Est-ce une première version ou un produit mature ?
            - text: "Sur une première version, les problèmes sont gros et visibles : huit personnes les trouveront. Sur un produit déjà poli, les frictions restantes sont plus fines et plus dispersées : allez vers douze."
          - listitem [ref=f1e77]:
            - strong [ref=f1e78]: Quelle est ma capacité de relecture ?
            - text: Chaque testeur supplémentaire, c'est autant de réponses à lire sérieusement. Un panel qu'on n'a pas le temps de relire ne vaut rien.
        - heading "Ce qui compte plus que le nombre" [level=2] [ref=f1e79]
        - paragraph [ref=f1e80]: "Le nombre de participants est la variable la plus visible et la moins déterminante. Trois choses pèsent davantage :"
        - list [ref=f1e81]:
          - listitem [ref=f1e82]:
            - strong [ref=f1e83]: La qualité du recrutement.
            - text: Dix personnes qui ressemblent à vos clients valent mieux que trente volontaires tirés d'un panel généraliste. Le métier, la situation et l'équipement réel font la différence, pas l'effectif.
          - listitem [ref=f1e84]:
            - strong [ref=f1e85]: La qualité des scénarios.
            - text: Un scénario qui guide la réponse ne produit rien, quel que soit le panel.
          - listitem [ref=f1e86]:
            - strong [ref=f1e87]: La discipline de relecture.
            - text: Écarter les réponses insuffisantes et ne garder que les participations complètes est ce qui donne du sens au « 9 sur 12 ». Un chiffre qui compte tout le monde, y compris ceux qui n'ont pas fini, ne veut rien dire.
        - paragraph [ref=f1e88]:
          - text: C'est pour cette raison que nos missions partent sur huit à douze profils recrutés à la main, avec une relecture de chaque réponse avant qu'elle n'entre dans le rapport. Pour savoir si c'est le bon format pour votre cas, le plus simple est d'en
          - link "parler quinze minutes" [ref=f1e89] [cursor=pointer]:
            - /url: /entreprises#brief
          - text: .
